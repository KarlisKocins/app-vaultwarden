---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

jobs:
  ci:
    # Deploying publishes images to the hassio-addons org and dispatches to
    # their app repository, neither of which a fork can do. This fork has no
    # image: key either, so the Supervisor builds the app locally and never
    # needs a published image. `needs: ci` skips the deploy job along with it.
    if: github.repository == 'hassio-addons/app-vaultwarden'
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
      security-events: write
    uses: hassio-addons/workflows/.github/workflows/app-ci.yaml@3846ae0fd09acec8ac1ac308ceacd052b9d01bec # v2.0.6
    with:
      slug: "bitwarden"

  deploy:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: hassio-addons/workflows/.github/workflows/app-deploy.yaml@3846ae0fd09acec8ac1ac308ceacd052b9d01bec # v2.0.6
    with:
      slug: "bitwarden"
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
